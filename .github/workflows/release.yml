name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Ensure npm >= 11.5.1 (required for trusted publishing)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run test:run
      - name: Check tag matches package version
        run: |
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          echo "Tag: ${GITHUB_REF_NAME}, package.json: ${PKG_VERSION}"
          test "${GITHUB_REF_NAME#v}" = "${PKG_VERSION}"
      - name: Show published file list
        run: npm pack --dry-run
      - name: Publish to npm
        # Uses npm Trusted Publishing (OIDC); provenance is generated automatically.
        run: npm publish --access public
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
