# Publishes the site (Jekyll build of the repo, as before) together with the
# HTML code coverage report to GitHub Pages.
# The coverage report ends up at https://asm80.github.io/asm80-core/coverage/index.html
# Requires: Settings → Pages → Source = "GitHub Actions".

name: Pages (coverage report)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - name: Run tests with coverage (generates coverage/)
      run: npm test
    - name: Drop raw coverage data
      run: rm -rf coverage/tmp
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Build site with Jekyll (README, docs/, coverage/)
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
